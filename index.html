<style>:root{--bg:#140B0C;--s1:#1E1213;--s2:#291819;--line:#3a2527;--tx:#F4EAE7;--mu:#a8918c;--ac:#C8283A;--ac2:#FF6F7B;--hd:#2A0A10;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
#app{min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.view{animation:vin .28s ease both}

.pad{padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.logo{font:600 15px Unbounded,sans-serif;letter-spacing:.02em}
.logo b{color:var(--ac2);font-weight:600}
.cnt{margin-left:auto;color:var(--mu);font-size:14px}
.cartbtn{position:relative;width:40px;height:40px;border-radius:50%;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center}
.cartbtn i{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--ac);font:600 11px/18px Inter;text-align:center;font-style:normal;padding:0 4px}
svg{display:block}
.chips{display:flex;gap:8px;padding:6px 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:15px;white-space:nowrap;transition:.2s}
.chips.main .chip{flex:1 1 0;text-align:center;padding:11px 8px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.chips.sub .chip{padding:8px 15px;font-size:14px}
.lbl{padding:12px 16px 2px;font:500 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.banner{margin:10px 16px 6px;border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:12px;display:flex;align-items:center;gap:12px}

.banner .t{flex:1;min-width:0}.banner b{display:block;font-weight:600}.banner span{color:var(--mu);font-size:13px}
.btn{display:block;width:100%;padding:16px;border-radius:16px;background:var(--ac);color:#fff;text-align:center;font:600 14px Inter;letter-spacing:.12em;text-transform:uppercase}
.btn.sm{width:auto;padding:11px 16px;letter-spacing:0;text-transform:none;font-size:14px;border-radius:12px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--tx);letter-spacing:.02em;text-transform:none;font-weight:500;font-size:15px}
.btn.red{background:none;border:1px solid var(--ac);color:var(--ac2);letter-spacing:.02em;text-transform:none;font-weight:600;font-size:15px}
.x{width:32px;height:32px;color:var(--mu);font-size:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px;padding:10px 16px}
.card{min-width:0}
.ph{position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:var(--s2)}
.ph .sl{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.ph .sl::-webkit-scrollbar{display:none}
.ph .sl img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.badge{position:absolute;left:12px;top:10px;font-size:13px;color:#fff;background:rgba(20,11,12,.55);backdrop-filter:blur(8px);padding:3px 10px;border-radius:99px;pointer-events:none}
.heart{position:absolute;right:10px;top:8px;width:38px;height:38px;border-radius:50%;background:rgba(20,11,12,.55);backdrop-filter:blur(8px);display:grid;place-items:center}
.heart.on svg{fill:var(--ac2);stroke:var(--ac2)}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}.dots i.on{background:#fff}
.br{margin-top:10px;font:600 14px Inter;letter-spacing:.14em;text-transform:uppercase}
.nm{color:var(--tx);opacity:.9;font-size:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cd{color:var(--mu);font-size:13px;margin-top:3px}
.pr{font-size:16px;margin-top:6px}
.empty{padding:80px 32px;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--tx);font:500 17px Unbounded;margin-bottom:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:20;pointer-events:none}

.tab.on{background:rgba(200,40,58,.22);color:var(--ac2)}
.srch{pointer-events:auto;flex:none;width:62px;height:62px;border-radius:50%;background:rgba(36,20,22,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.45);display:grid;place-items:center}
.back{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;font-size:16px;color:var(--tx)}
.gal{position:relative;margin:4px 16px 0;aspect-ratio:1/1.05;border-radius:22px;overflow:hidden;background:var(--s2)}
.gal .sl{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal .sl::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.h1{font:600 22px Unbounded,sans-serif;letter-spacing:.02em;margin:18px 16px 0;text-transform:uppercase}
.h2{font:500 17px Inter;margin:2px 16px 0;opacity:.9}
.big{font-size:26px;margin:14px 16px}
.box{margin:12px 16px;border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:6px 18px}
.box.p{padding:16px 18px}
.row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row span:first-child{color:var(--mu)}.row span:last-child{text-align:right}
.eyb{font:500 11px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.sec{font:600 15px Inter;letter-spacing:.14em;text-transform:uppercase;margin:26px 16px 6px}
.hs{display:flex;gap:12px;overflow-x:auto;padding:6px 16px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.hs .card{flex:0 0 44%}
.fix{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));z-index:25;background:linear-gradient(0deg,var(--bg) 62%,transparent)}
.fix .btn+.btn{margin-top:8px}
.hero{margin:6px 16px;border-radius:24px;padding:24px 20px;background:radial-gradient(120% 140% at 0% 0%,#7a1423 0%,#2a0a10 55%,#140B0C 100%);border:1px solid var(--line)}

.list{margin:12px 16px;border:1px solid var(--line);background:var(--s1);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);width:100%;text-align:left}

.faq{border-bottom:1px solid var(--line)}.faq:last-child{border:0}

.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;animation:fin .2s both}
@keyframes fin{from{opacity:0}}

.sheet h3{margin:0 0 6px;font:600 16px Inter;letter-spacing:.14em;text-transform:uppercase}
.sheet p{margin:0 0 16px;color:var(--mu)}
.in{display:block;width:100%;margin:0 0 12px;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:16px Inter;outline:0}
.in:focus{border-color:var(--ac)}

.in.bad{border-color:#ff4d5e}
.sheet .cancel{display:block;margin:12px auto 0;color:var(--mu)}
.search{margin:6px 16px;position:relative}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 18px;border-radius:99px;font-size:14px;z-index:60;animation:vin .2s both;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.grid.sold .ph img{filter:grayscale(.55) brightness(.85)}
/* компактная сетка: 3 в ряд */
.grid{grid-template-columns:repeat(3,1fr);gap:16px 8px;padding:10px 12px}
.ph{border-radius:12px}
.badge{left:6px;top:6px;font-size:10px;padding:2px 7px}
.heart{right:5px;top:5px;width:28px;height:28px}
.heart svg{width:16px;height:16px}
.dots{bottom:5px;gap:3px}.dots i{width:4px;height:4px}
.br{font-size:10.5px;letter-spacing:.08em;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-size:12px;line-height:1.25;-webkit-line-clamp:2}
.cd{display:none}
.pr{font-size:13px;margin-top:4px;font-weight:500}
.hs .card{flex:0 0 31%}

/* надёжная высота фото в WebView iOS */

.ph img,.gal img{display:block;min-height:100%;background:var(--s2)}
.gal{min-height:260px}

@keyframes lup{to{transform:translateY(0)}}

.loader>div{animation:loaderTxt .9s ease-in 2.05s forwards}

.loader span{display:inline-block;overflow:hidden}
.loader span i{display:inline-block;font-style:normal;transform:translateY(110%);animation:lup .8s cubic-bezier(.22,1,.36,1) forwards}

.nav.l{left:10px}.nav.r{right:10px}
.nav:active{background:var(--ac)}
.gal .dots{bottom:12px}.gal .dots i{width:7px;height:7px}

V.contacts = () => pageBox("Контакты", '<div class="list">' + CONTACTS.map((c) => (c.href ? '<button class="li" data-ext="' + c.href + '">' : '<div class="li">') + '<span class="t"><b>' + esc(c.v) + "</b><span>" + esc(c.k) + ". " + esc(c.d) + "</span></span>" + (c.href ? '<span class="ar">' + I.ar + "</span></button>" : "</div>")).join("") + "</div>" +
  '<div class="box p" style="color:var(--mu);font-size:13px">' + DOCS.map(esc).join("<br>") + "</div>");

/* ---------- отрисовка ---------- */
function plural(n, a, b, c) { const m = n % 100, d = n % 10; return m > 10 && m < 20 ? c : d === 1 ? a : d > 1 && d < 5 ? b : c; }
function cur() { return S.stack.length ? S.stack[S.stack.length - 1] : { v: S.tab }; }
function render(keep) {
  const c = cur(), fn = V[c.v];
  const y = keep ? window.scrollY : 0;
  $("#app").innerHTML = '<div class="view">' + fn(c.id) + "</div>";
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.tab === S.tab));
  $("#tabs").style.display = c.v === "product" || c.v === "cart" ? "none" : "";
  window.scrollTo(0, y);
  if (c.v === "search") { const q = $("#q"); $("#res").innerHTML = resHtml(); q.oninput = () => { S.q = q.value; $("#res").innerHTML = resHtml(); }; }
  syncBack();
}
function syncBack() { try { if (!tg) return; S.stack.length ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {} }
function push(v, id) { S.stack.push({ v, id, y: window.scrollY }); render(); }
function back() { const p = S.stack.pop(); render(); if (p) window.scrollTo(0, p.y || 0); }
function save() {
  store.set("rsm_favs", S.favs); store.set("rsm_cart", S.cart); store.set("rsm_book", S.book);
  try { tg && tg.CloudStorage && tg.CloudStorage.setItem("rsm", JSON.stringify({ f: S.favs, c: S.cart, b: S.book })); } catch (e) {}
}
const bookLeft = (id) => { const t = S.book[id]; if (!t) return 0; return Math.max(0, t + 864e5 - Date.now()); };
const fmtLeft = (ms) => Math.floor(ms / 36e5) + " ч " + String(Math.floor(ms % 36e5 / 6e4)).padStart(2, "0") + " мин";
function toast(t) { const e = document.createElement("div"); e.className = "toast"; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 1800); }
function msgManager(t) { openTg(link(t)); }

function sheet(key) {
  const f = FORMS[key]; if (!f) return;
  const bg = document.createElement("div"); bg.className = "sheetbg";
  const sh = document.createElement("div"); sh.className = "sheet";
  sh.innerHTML = "<h3>" + esc(f.title) + "</h3><p>" + esc(f.lead) + "</p>" + f.fields.map((x) => (x[2] === "area" ? '<textarea class="in" name="' + x[0] + '" placeholder="' + esc(x[1]) + (x[5] ? ". " + esc(x[5]) : "") + '"></textarea>' : '<input class="in" name="' + x[0] + '" type="' + (x[3] || "text") + '" placeholder="' + esc(x[1]) + '">')).join("") + '<button class="btn" data-send>' + esc(f.btn) + '</button><button class="cancel" data-close>Отмена</button>';
  const close = () => { bg.remove(); sh.remove(); };
  bg.onclick = close; sh.querySelector("[data-close]").onclick = close;
  sh.querySelector("[data-send]").onclick = () => {
    let ok = true, lines = [];
    f.fields.forEach((x) => { const el = sh.querySelector('[name="' + x[0] + '"]'), v = el.value.trim(); el.classList.toggle("bad", !!x[4] && !v); if (x[4] && !v) ok = false; if (v) lines.push(x[1].replace("*", "") + ": " + v); });
    if (!ok) { buzz("heavy"); return; }
    close(); msgManager(f.subj + "\n\n" + lines.join("\n")); toast("Открываем чат с менеджером");
  };
  document.body.append(bg, sh);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab],[data-go],[data-open],[data-fav],[data-set],[data-sec],[data-a],[data-form],[data-back],[data-rm],[data-faq],[data-q],[data-ext],[data-ref],[data-nav],[data-srch]");
  if (!t) return;
  const d = t.dataset;
  if (d.fav) { e.stopPropagation(); const id = +d.fav; S.favs = S.favs.includes(id) ? S.favs.filter((x) => x !== id) : S.favs.concat(id); save(); buzz(); t.classList.toggle("on", S.favs.includes(id)); if (cur().v === "fav") render(true); return; }
  if (d.tab) { buzz(); S.stack = []; S.tab = d.tab; render(); return; }
  if (d.srch !== undefined) { buzz(); S.stack = []; S.tab = "search"; render(); setTimeout(() => $("#q") && $("#q").focus(), 50); return; }
  if (d.back !== undefined) { back(); return; }
  if (d.open) { buzz(); push("product", +d.open); return; }
  if (d.go) { buzz(); push(d.go); return; }
  if (d.sec) { S.sec = S.sec === d.sec ? null : d.sec; render(true); return; }
  if (d.set) { const k = d.set; S[k] = k === "sort" ? d.v : (S[k] === d.v ? "" : d.v); buzz(); render(true); return; }
  if (d.nav) { e.stopPropagation(); buzz(); const sl = t.parentNode.querySelector("[data-sl]"); sl.scrollBy({ left: +d.nav * sl.clientWidth, behavior: "smooth" }); return; }
  if (d.ref) { buzz(); S.ref = d.ref; render(true); return; }
  if (d.form) { buzz(); sheet(d.form); return; }
  if (d.rm) { S.cart = S.cart.filter((x) => x !== +d.rm); save(); render(true); return; }
  if (d.faq !== undefined) { S.faq = S.faq === +d.faq ? -1 : +d.faq; render(true); return; }
  if (d.q) { msgManager(d.q); return; }
  if (d.ext) { /^https:\/\/t\.me\//.test(d.ext) ? openTg(d.ext) : openLink(d.ext); return; }
  if (d.a === "hint") { S.hint = false; store.set("rsm_hint", true); render(true); }
  else if (d.a === "home") { try { tg.addToHomeScreen(); } catch (er) {} }
  else if (d.a === "concierge") sheet("concierge");
  else if (d.a === "manager") msgManager("Здравствуйте! Хочу задать вопрос.");
  else if (d.a === "channel") openTg(CHANNEL);
  else if (d.a === "photos") { const it = byId(d.id); msgManager("Здравствуйте! Пришлите, пожалуйста, дополнительные фото и видео: " + it.brand + " " + it.name + " (" + art(it) + ")"); }
  else if (d.a === "book") { const it = byId(d.id); buzz("medium"); S.book[it.id] = Date.now(); save(); msgManager("Здравствуйте! Хочу забронировать на 24 часа: " + it.brand + " " + it.name + " (" + art(it) + ")"); render(true); }
  else if (d.a === "ask") { const it = byId(d.id); msgManager("Здравствуйте! Вопрос по лоту: " + it.brand + " " + it.name + " (" + art(it) + ")"); }
  else if (d.a === "cart") { const id = +d.id; buzz("medium"); if (S.cart.includes(id)) { push("cart"); return; } S.cart.push(id); save(); toast("Добавлено в корзину"); render(true); }
  else if (d.a === "order") { const l = S.cart.map(byId).filter(Boolean); msgManager("Здравствуйте! Хочу оформить заказ:\n\n" + l.map((i, n) => (n + 1) + ". " + i.brand + " " + i.name + " (" + art(i) + "), " + fmt(i.price)).join("\n")); }
});
/* точки слайдера */
document.addEventListener("scroll", (e) => {
  const s = e.target; if (!s.matches || !s.matches("[data-sl]")) return;
  const i = Math.round(s.scrollLeft / s.clientWidth), ds = s.parentNode.querySelectorAll(".dots i");
  ds.forEach((d, n) => d.classList.toggle("on", n === i));
}, true);

/* ---------- запуск ---------- */
(function init() {
  $("#tabs").innerHTML = '<div class="pill">' + [["catalog", "Каталог", I.cat], ["fav", "Избранное", I.heart.replace('width="22" height="22"', 'width="26" height="26"')], ["sell", "Продать", I.sell], ["info", "Инфо", I.info]].map((t) => '<button class="tab" data-tab="' + t[0] + '">' + t[2] + "<span>" + t[1] + "</span></button>").join("") + '</div><button class="srch" data-srch aria-label="Поиск">' + I.search + "</button>";
  try {
    if (tg) {
      tg.ready(); tg.expand();
      try { tg.setHeaderColor("#2A0A10"); tg.setBackgroundColor("#140B0C"); tg.setBottomBarColor("#140B0C"); } catch (e) {}
      try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
      tg.BackButton.onClick(() => back());
    }
  } catch (e) {}
  try {
    const qp = new URLSearchParams(location.search), sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "", want = qp.get("tab") || sp;
    if (["catalog", "fav", "sell", "info"].includes(want)) S.tab = want;
  } catch (e) {}
  render();
  try {
    if (tg && tg.CloudStorage) tg.CloudStorage.getItem("rsm", (err, v) => {
      if (err || !v) return;
      try {
        const o = JSON.parse(v), u = (a, b) => [...new Set((a || []).concat(b || []))];
        S.favs = u(S.favs, o.f); S.cart = u(S.cart, o.c);
        Object.keys(o.b || {}).forEach((k) => { if (!S.book[k] || o.b[k] > S.book[k]) S.book[k] = o.b[k]; });
        store.set("rsm_favs", S.favs); store.set("rsm_cart", S.cart); store.set("rsm_book", S.book); render(true);
      } catch (e) {}
    });
  } catch (e) {}
})();

</script></body></html>
