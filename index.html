<style>
/* Noir Atelier: чёрный, золото, засечки. Красный — только для ошибок. */
:root{--bg:#0B0A09;--s1:#141210;--s2:#1C1915;--line:#2B2620;--tx:#F2EDE4;--mu:#8F877A;--ac:#C9A35C;--ac2:#E3C98F;--on:#0B0A09;--ok:#9DBF7E;--bad:#E0655A;--hd:#0B0A09;--r:8px;
  --serif:"Cormorant Garamond","Times New Roman",serif;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
#app{min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.view{animation:vin .35s var(--ease) both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pad{padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:16px 16px 6px}
.logo{font:600 24px/1 var(--serif);letter-spacing:.01em}
.logo b{color:var(--ac);font-weight:600;font-style:italic}
.logo small{display:block;font:500 10px Inter;letter-spacing:.22em;text-transform:uppercase;color:var(--mu);margin-top:6px}
.cnt{margin-left:auto;color:var(--mu);font-size:13px}
.cartbtn{margin-left:auto;position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .16s var(--ease)}
.cartbtn:active{transform:scale(.94)}
.cartbtn i{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:var(--on);font:600 11px/18px Inter;text-align:center;font-style:normal;padding:0 4px}
svg{display:block}
.sbar{margin:8px 16px 4px;display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);color:var(--mu);width:calc(100% - 32px);text-align:left}
.sbar svg{width:18px;height:18px}
.chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;scrollbar-width:none;scroll-padding:0 16px}

.chip{flex:0 0 auto;padding:9px 14px;border-radius:6px;border:1px solid var(--line);font-size:14px;white-space:nowrap;color:var(--tx);transition:background-color .2s,border-color .2s,color .2s}

.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
.chips.sub .chip{padding:7px 12px;font-size:13px}
.lbl{padding:10px 16px 0;font:500 10.5px Inter;letter-spacing:.2em;text-transform:uppercase;color:var(--mu)}
.banner{margin:8px 16px 4px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:12px}
.banner .ic{width:36px;height:36px;border-radius:6px;border:1px solid var(--ac);color:var(--ac);display:grid;place-items:center;font:600 15px var(--serif);flex:none}
.banner .t{flex:1;min-width:0}.banner b{display:block;font-weight:500;font-size:14px}.banner span{color:var(--mu);font-size:12.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:6px;background:var(--ac);color:var(--on);text-align:center;font:600 13px Inter;letter-spacing:.16em;text-transform:uppercase;transition:transform .16s var(--ease),opacity .2s}
.btn:active{transform:scale(.98)}
.btn.sm{width:auto;padding:9px 14px;letter-spacing:.02em;text-transform:none;font-size:13px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--tx);letter-spacing:.02em;text-transform:none;font-weight:500;font-size:14.5px}
.btn.red{background:none;border:1px solid var(--ac);color:var(--ac);letter-spacing:.02em;text-transform:none;font-weight:500;font-size:14.5px}
.x{width:32px;height:32px;color:var(--mu);font-size:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 12px;padding:10px 16px}

.card{min-width:0}
.ph{position:relative;aspect-ratio:4/5;border-radius:4px;overflow:hidden;background:var(--s2)}
.ph .sl{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.ph .sl::-webkit-scrollbar{display:none}
.ph .sl img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.badge{position:absolute;left:8px;top:8px;font:500 10.5px Inter;letter-spacing:.08em;color:var(--tx);background:rgba(11,10,9,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:4px 8px;border-radius:3px;pointer-events:none;border:1px solid rgba(201,163,92,.35)}
.badge.vid{left:auto;right:8px;top:auto;bottom:8px;display:flex;gap:4px;align-items:center;color:var(--ac2)}
.heart{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:50%;background:rgba(11,10,9,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;transition:transform .2s var(--ease)}
.heart:active{transform:scale(.86)}
.heart svg{width:18px;height:18px}
.heart.on svg{fill:var(--ac);stroke:var(--ac)}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:4px;pointer-events:none}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35)}.dots i.on{background:#fff}
.br{margin-top:10px;font:500 10.5px Inter;letter-spacing:.18em;text-transform:uppercase;color:var(--ac);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{color:var(--tx);font:500 17px/1.15 var(--serif);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cd{color:var(--mu);font-size:12px;margin-top:3px}
.pr{font-size:14.5px;margin-top:5px;font-weight:500}
.pr s{color:var(--mu);font-weight:400;font-size:12px;margin-left:6px}
.empty{padding:60px 32px;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--tx);font:600 24px var(--serif);margin-bottom:8px}
/* нижняя панель: прикреплена к низу, не закрывает контент */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 0 env(safe-area-inset-bottom);background:rgba(11,10,9,.9);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border-top:1px solid var(--line)}
.pill{display:flex;justify-content:space-around;padding:6px 6px 8px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;font-size:10.5px;letter-spacing:.04em;color:var(--mu);min-width:60px;transition:color .2s}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--ac)}
.tab.on::before{content:"";position:absolute;top:-7px;left:50%;width:18px;height:2px;margin-left:-9px;background:var(--ac);border-radius:2px}
.tab i{position:absolute;top:2px;left:50%;margin-left:6px;min-width:16px;height:16px;border-radius:8px;background:var(--ac);color:var(--on);font:600 10px/16px Inter;font-style:normal;padding:0 4px}
.back{display:flex;align-items:center;gap:6px;padding:14px 16px 8px;font-size:15px;color:var(--mu)}
.gal{position:relative;margin:4px 0 0;aspect-ratio:1/1.05;overflow:hidden;background:var(--s2)}
.gal .sl{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal .sl::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.eyb{font:500 10.5px Inter;letter-spacing:.2em;text-transform:uppercase;color:var(--mu)}
.pbr{margin:20px 16px 0;font:500 11px Inter;letter-spacing:.22em;text-transform:uppercase;color:var(--ac)}
.h1{font:600 30px/1.05 var(--serif);margin:6px 16px 0}
.h2{font:500 15px Inter;margin:6px 16px 0;color:var(--mu)}
.big{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;font-size:24px;font-weight:500;margin:12px 16px 14px}
.big s{font-size:14px;color:var(--mu);font-weight:400}
.big em{font-style:normal;font-size:12px;letter-spacing:.06em;color:var(--on);background:var(--ac);padding:3px 7px;border-radius:3px;font-weight:600}
.trust{display:flex;gap:6px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none}.trust::-webkit-scrollbar{display:none}
.trust span{flex:none;display:flex;align-items:center;gap:6px;font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-radius:4px;color:var(--tx)}
.trust svg{width:15px;height:15px;color:var(--ac)}
.acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.acts3 button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--tx);text-align:center;transition:border-color .2s,transform .16s var(--ease)}
.acts3 button:active{transform:scale(.97)}
.acts3 svg{width:20px;height:20px;color:var(--ac)}
.acts3 button.on{border-color:var(--ac);color:var(--ac)}
.box{margin:12px 16px;border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:4px 16px}
.box.p{padding:16px}
.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row span:first-child{color:var(--mu)}.row span:last-child{text-align:right}
.sec{font:600 22px var(--serif);margin:28px 16px 4px;letter-spacing:.005em}
.hs{display:flex;gap:12px;overflow-x:auto;padding:6px 16px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.hs .card{flex:0 0 42%}
.fix{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));z-index:25;background:linear-gradient(0deg,var(--bg) 62%,transparent)}
.fix .btn+.btn{margin-top:8px}
.hero{margin:6px 16px;border-radius:var(--r);padding:26px 20px;border:1px solid var(--line);background:var(--s1);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--ac),transparent)}
.hero .eyb{color:var(--ac)}.hero h2{font:600 30px/1.05 var(--serif);margin:10px 0 8px}.hero p{margin:0;color:var(--mu)}
.list{margin:12px 16px;border:1px solid var(--line);background:var(--s1);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border:0}.li .t{flex:1;min-width:0}.li b{display:block;font-weight:500;font-size:15.5px}.li span{color:var(--mu);font-size:13px}
.li .ar{color:var(--mu)}
.ico{width:38px;height:38px;border-radius:6px;border:1px solid var(--line);color:var(--ac);display:grid;place-items:center;flex:none}
.cartrow{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.cartrow:last-child{border:0}
.cartrow img{width:72px;height:88px;border-radius:4px;object-fit:cover;background:var(--s2)}
.cartrow .t{flex:1;min-width:0}
.faq{border-bottom:1px solid var(--line)}.faq:last-child{border:0}
.faq button{width:100%;text-align:left;padding:15px 0;display:flex;justify-content:space-between;gap:12px;font-weight:500}
.faq p{margin:0;padding:0 0 15px;color:var(--mu)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;animation:fin .2s both}
@keyframes fin{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--s1);border-radius:16px 16px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));z-index:41;animation:sup .4s var(--ease) both;border-top:1px solid var(--line)}
@keyframes sup{from{transform:translateY(100%)}}
.sheet h3{margin:0 0 6px;font:600 26px var(--serif)}
.sheet p{margin:0 0 16px;color:var(--mu)}
.in{display:block;width:100%;margin:0 0 10px;padding:15px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:16px Inter;outline:0;transition:border-color .2s}
.in:focus{border-color:var(--ac)}
textarea.in{min-height:96px;resize:none}
.in.bad{border-color:var(--bad)}
.sheet .cancel{display:block;margin:12px auto 0;color:var(--mu)}
.search{margin:6px 16px;position:relative}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:6px;font-size:14px;z-index:60;animation:vin .25s both;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.grid.sold .ph img{filter:grayscale(.7) brightness(.8)}
.ph .sl,.gal .sl{position:absolute;left:0;top:0;right:0;bottom:0;height:auto}
.ph img,.gal img{display:block;min-height:100%;background:var(--s2)}
.gal{min-height:280px}
.ph img[data-bad],.gal img[data-bad]{opacity:0}
.nav{position:absolute;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:50%;background:rgba(11,10,9,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;z-index:3;color:#fff}
.nav.l{left:10px}.nav.r{right:10px}
.nav:active{background:var(--ac);color:var(--on)}
.gal .dots{bottom:14px}.gal .dots i{width:6px;height:6px}
.vbtn{position:absolute;left:14px;bottom:14px;z-index:3;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:var(--ac);color:var(--on);font:600 12.5px Inter}
.vbtn svg{width:14px;height:14px}
/* шкала состояния */
.grade{display:flex;gap:3px;margin:10px 0 6px}.grade i{flex:1;height:4px;border-radius:2px;background:var(--line)}.grade i.on{background:var(--ac)}
.defs{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px;scrollbar-width:none}.defs::-webkit-scrollbar{display:none}
.defs figure{flex:0 0 120px;margin:0}.defs img{width:120px;height:120px;object-fit:cover;border-radius:4px;background:var(--s2)}.defs figcaption{font-size:12px;color:var(--mu);margin-top:5px;line-height:1.3}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:12px}.checks span{display:flex;gap:7px;align-items:center;font-size:13.5px}.checks svg{width:14px;height:14px;color:var(--ac);flex:none}
.vid{position:fixed;inset:0;z-index:70;background:#000;display:flex;align-items:center;justify-content:center;animation:fin .25s both}
.vid video{width:100%;max-height:100%}
.vid .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:24px}
#splash{position:fixed;inset:0;z-index:200;background:#0B0A09;transition:opacity .7s ease}#splash video{width:100%;height:100%;object-fit:cover;display:block}#splash.hide{opacity:0;pointer-events:none}
/* ---------- отклик кнопок: нажатие, пружинка, блик на главной кнопке ---------- */
.chip,.li,.sbar,.nav,.vbtn,.tab,.ph,.back,.cartrow img,.faq button,.sheet .cancel,.x{transition:transform .18s var(--ease),background-color .2s,border-color .2s,color .2s}
.chip:active,.sbar:active,.back:active,.x:active{transform:scale(.95)}
.li:active{background:var(--s2)}
.nav:active,.vbtn:active{transform:scale(.9)}
.ph:active{transform:scale(.985)}
.tab:active svg{transform:scale(.84)}
.tab svg{transition:transform .25s var(--ease)}
.tab.on svg{animation:tpop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes tpop{0%{transform:scale(.8)}55%{transform:scale(1.15) translateY(-2px)}100%{transform:none}}
.heart.pop svg{animation:hpop .5s cubic-bezier(.34,1.56,.64,1)}

.heart.pop::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--ac);animation:ring .55s var(--ease) forwards;pointer-events:none}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.45);opacity:0}}
.btn{position:relative;overflow:hidden;isolation:isolate}
.btn.shine::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;z-index:-1;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);animation:shine 5.5s ease-in-out 1.2s infinite}
@keyframes shine{0%,72%{left:-60%}100%{left:130%}}
.cartbtn i.bump,.tab i.bump{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.acts3 button.on svg{animation:hpop .5s cubic-bezier(.34,1.56,.64,1)}
.box[style*="border-color:var(--ac)"]{animation:glow 1.6s var(--ease) 1}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(201,163,92,.45)}100%{box-shadow:0 0 0 14px rgba(201,163,92,0)}}
.card{animation:vin .5s var(--ease) both;animation-delay:calc(var(--k,0) * 45ms)}
/* примерка */
.tstage{position:relative;margin:12px 16px 0;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--s2);border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.tphoto{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.tbag{position:absolute;left:0;top:0;width:40%;transform-origin:center;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));cursor:grab;touch-action:none;animation:fin .4s var(--ease) both}
.tempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:var(--mu)}
.tempty svg{color:var(--line);margin-bottom:6px}.tempty b{color:var(--tx);font:600 24px var(--serif)}.tempty span{font-size:13.5px;max-width:280px}
.rng{width:100%;margin:12px 0 0;accent-color:var(--ac)}
.vbtn.try{left:auto;right:14px;background:rgba(11,10,9,.65);color:var(--ac2);border:1px solid rgba(201,163,92,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>

  else if (d.a === "wish") { msgManager("Здравствуйте! Сообщите, пожалуйста, когда появится: " + (S.q.trim() || "нужная модель")); }
  else if (d.a === "ask") { const it = byId(d.id); msgManager("Здравствуйте! Вопрос по лоту: " + it.brand + " " + it.name + " (" + art(it) + ")"); }
  else if (d.a === "cart") { const id = +d.id; buzz("medium"); if (S.cart.includes(id)) { push("cart"); return; } S.cart.push(id); save(); toast("Добавлено в корзину"); render(true); const b = document.querySelector(".cartbtn i"); if (b) b.classList.add("bump"); }
  else if (d.a === "order") { const l = S.cart.map(byId).filter(Boolean); msgManager("Здравствуйте! Хочу оформить заказ:\n\n" + l.map((i, n) => (n + 1) + ". " + i.brand + " " + i.name + " (" + art(i) + "), " + fmt(i.price)).join("\n")); }
});
/* точки слайдера */
document.addEventListener("scroll", (e) => {
  const s = e.target; if (!s.matches || !s.matches("[data-sl]")) return;
  const i = Math.round(s.scrollLeft / s.clientWidth), ds = s.parentNode.querySelectorAll(".dots i");
  ds.forEach((d, n) => d.classList.toggle("on", n === i));
}, true);

/* ---------- живой каталог (бот) ---------- */
const API = "https://rsm-bot.idjjjd0.workers.dev", CAT_API = API + "/api/catalog";
function applyCat(list) {
  if (!Array.isArray(list)) return false;
  ALL.splice(0, ALL.length, ...list);
  ITEMS = ALL.filter((i) => !i.sold); SOLD = ALL.filter((i) => i.sold);
  S.stack = S.stack.filter((e) => (e.v !== "product" || byId(e.id)) && (e.v !== "compare" || String(e.id).split(":").every(byId)));
  return true;
}
let deepDone = false;
function openDeep() {
  if (deepDone) return;
  try {
    const qp = new URLSearchParams(location.search), sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "", sm = /^item_(\d+)$/.exec(sp), id = +(qp.get("item") || (sm && sm[1]) || 0);
    if (id && byId(id)) { deepDone = true; S.tab = "catalog"; push("product", id); }
  } catch (e) {}
}
function loadCat() {
  try {
    const ac = new AbortController(), t = setTimeout(() => ac.abort(), 7000);
    fetch(CAT_API, { signal: ac.signal }).then((r) => r.json()).then((l) => {
      clearTimeout(t);
      if (applyCat(l)) { store.set("rsm_cat", l); render(true); }
      openDeep();
    }).catch(() => {});
  } catch (e) {}
}

/* ---------- запуск ---------- */
(function init() {
  $("#tabs").innerHTML = '<div class="pill">' + [["catalog", "Каталог", I.cat], ["fav", "Избранное", I.heart.replace('width="22" height="22"', 'width="26" height="26"')], ["sell", "Продать", I.sell], ["info", "Инфо", I.info]].map((t) => '<button class="tab" data-tab="' + t[0] + '">' + t[2] + "<span>" + t[1] + "</span></button>").join("") + "</div>";
  try {
    if (tg) {
      tg.ready(); tg.expand();
      try { tg.setHeaderColor("#0B0A09"); tg.setBackgroundColor("#0B0A09"); tg.setBottomBarColor("#0B0A09"); } catch (e) {}
      try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
      tg.BackButton.onClick(() => back());
    }
  } catch (e) {}
  try {
    const qp = new URLSearchParams(location.search), sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "", want = qp.get("tab") || sp;
    if (["catalog", "fav", "sell", "info"].includes(want)) S.tab = want;
  } catch (e) {}
  try { applyCat(store.get("rsm_cat", null)); } catch (e) {}
  render();
  openDeep();
  loadCat();
  try {
    if (tg && tg.CloudStorage) tg.CloudStorage.getItem("rsm", (err, v) => {
      if (err || !v) return;
      try {
        const o = JSON.parse(v), u = (a, b) => [...new Set((a || []).concat(b || []))];
        S.favs = u(S.favs, o.f); S.cart = u(S.cart, o.c);
        Object.keys(o.b || {}).forEach((k) => { if (!S.book[k] || o.b[k] > S.book[k]) S.book[k] = o.b[k]; });
        store.set("rsm_favs", S.favs); store.set("rsm_cart", S.cart); store.set("rsm_book", S.book); render(true);
      } catch (e) {}
    });
  } catch (e) {}
})();
